<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidecut — Player</title>
<style>
  :root{
    --floor:#101710;
    --panel:#1B2419;
    --panel-line: rgba(236,242,230,0.09);
    --cream:#ECF2E6;
    --cream-dim: rgba(236,242,230,0.55);
    --amber:#4FAF7D;
    --plum:#2F6B4F;
    --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-body: 'Work Sans', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(79,175,125,0.08), transparent 55%),
      var(--floor);
    color:var(--cream);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 2.5rem 1.2rem;
    -webkit-font-smoothing:antialiased;
  }

  .player{
    width: 780px;
    max-width:100%;
    background: var(--panel);
    border-radius: 18px;
    border: 1px solid var(--panel-line);
    box-shadow: 0 50px 90px -30px rgba(0,0,0,0.6);
    overflow:hidden;
  }

  .main-row{
    display:grid;
    grid-template-columns: 260px 1fr;
    gap: 2.4rem;
    padding: 2.4rem 2.4rem 1.6rem;
  }

  /* Turntable */
  .turntable{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .disc{
    width: 220px;
    height:220px;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle at center, #0B120C 0px, #0B120C 2px, #16211A 2px, #16211A 4px);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(236,242,230,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 9s linear infinite;
    animation-play-state: paused;
  }

  .disc.spinning{ animation-play-state: running; }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .disc-label{
    width:84px;
    height:84px;
    border-radius:50%;
    background: linear-gradient(155deg, var(--amber), var(--plum));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.4rem;
    color: var(--floor);
    box-shadow: inset 0 0 0 3px rgba(16,23,16,0.35);
  }

  .disc-label::after{
    content:"";
    position:absolute;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--floor);
  }

  /* Track info + controls */
  .track-panel{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
  }

  .track-kicker{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--amber);
    margin:0 0 0.6rem;
  }

  .track-title{
    font-family:var(--font-display);
    font-size:1.9rem;
    font-weight:600;
    margin:0 0 0.3rem;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .track-artist{
    font-size:0.98rem;
    color:var(--cream-dim);
    margin: 0 0 1.6rem;
  }

  /* Progress */
  .progress-row{
    display:flex;
    align-items:center;
    gap:0.7rem;
    margin-bottom:1.6rem;
  }

  .time{
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--cream-dim);
    width:38px;
    flex-shrink:0;
  }

  .time.end{ text-align:right; }

  .progress-track{
    flex:1;
    height:4px;
    background: rgba(236,242,230,0.14);
    border-radius:3px;
    position:relative;
    cursor:pointer;
  }

  .progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background: var(--amber);
    border-radius:3px;
  }

  .progress-thumb{
    position:absolute;
    top:50%;
    width:12px; height:12px;
    border-radius:50%;
    background: var(--cream);
    left:0%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 4px rgba(79,175,125,0.18);
    opacity:0;
    transition: opacity 0.2s ease;
  }

  .progress-track:hover .progress-thumb{ opacity:1; }

  /* Transport controls */
  .transport{
    display:flex;
    align-items:center;
    gap:1.1rem;
    margin-bottom:1.7rem;
  }

  .tbtn{
    background:none;
    border:none;
    color:var(--cream);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0.4rem;
    transition: color 0.2s ease, transform 0.15s ease;
  }

  .tbtn:hover{ color:var(--amber); }
  .tbtn:active{ transform: scale(0.92); }

  .tbtn svg{ width:20px; height:20px; }

  .tbtn.play-pause{
    width:52px; height:52px;
    border-radius:50%;
    background:var(--amber);
    color:var(--floor);
  }

  .tbtn.play-pause:hover{ background:#7BD69B; color:var(--floor); }
  .tbtn.play-pause svg{ width:22px; height:22px; }

  .tbtn.shuffle.active, .tbtn.repeat.active{ color:var(--amber); }

  .spacer-flex{ flex:1; }

  /* Volume */
  .volume-row{
    display:flex;
    align-items:center;
    gap:0.6rem;
    max-width:160px;
  }

  .volume-track{
    flex:1;
    height:4px;
    background:rgba(236,242,230,0.14);
    border-radius:3px;
    position:relative;
    cursor:pointer;
  }

  .volume-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:70%;
    background:var(--cream-dim);
    border-radius:3px;
  }

  .volume-track:hover .volume-fill{ background: var(--amber); }

  /* Playlist */
  .playlist{
    border-top:1px solid var(--panel-line);
    padding: 0.6rem 1rem 1.2rem;
    max-height: 260px;
    overflow-y:auto;
  }

  .playlist-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 1rem 0.8rem 0.6rem;
  }

  .playlist-header h2{
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--cream-dim);
    font-weight:400;
    margin:0;
  }

  .autoplay-toggle{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.72rem;
    color:var(--cream-dim);
    font-family:var(--font-mono);
    cursor:pointer;
    user-select:none;
  }

  .autoplay-toggle input{ accent-color: var(--amber); }

  .track-row{
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding: 0.7rem 0.8rem;
    border-radius:8px;
    cursor:pointer;
    transition: background 0.2s ease;
  }

  .track-row:hover{ background: rgba(236,242,230,0.05); }

  .track-row.active{ background: rgba(79,175,125,0.12); }

  .track-num{
    width:20px;
    font-family:var(--font-mono);
    font-size:0.78rem;
    color:var(--cream-dim);
    text-align:center;
    flex-shrink:0;
  }

  .track-row.active .track-num{ color:var(--amber); }

  .eq{
    display:flex;
    align-items:flex-end;
    gap:2px;
    width:20px;
    height:14px;
  }

  .eq span{
    width:3px;
    background:var(--amber);
    border-radius:1px;
    animation: eqbar 0.9s ease-in-out infinite;
  }

  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:0.15s; }
  .eq span:nth-child(3){ height:65%; animation-delay:0.3s; }

  @keyframes eqbar{
    0%, 100%{ transform: scaleY(0.4); }
    50%{ transform: scaleY(1); }
  }

  .track-row-info{ flex:1; min-width:0; }

  .track-row-title{
    font-size:0.92rem;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .track-row-artist{
    font-size:0.78rem;
    color:var(--cream-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .track-row-duration{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--cream-dim);
    flex-shrink:0;
  }

  .playlist::-webkit-scrollbar{ width:6px; }
  .playlist::-webkit-scrollbar-thumb{ background: rgba(236,242,230,0.15); border-radius:3px; }

  @media (max-width: 640px){
    .main-row{
      grid-template-columns:1fr;
      padding: 2rem 1.4rem 1.2rem;
      text-align:center;
    }
    .turntable{ margin-bottom:0.5rem; }
    .disc{ width:170px; height:170px; }
    .transport{ justify-content:center; }
    .volume-row{ margin:0 auto; }
    .progress-row{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    .disc{ animation:none; }
    .eq span{ animation:none; }
    *{ transition-duration:0.01ms !important; }
  }

  button:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }
</style>
</head>
<body>

<div class="player">
  <div class="main-row">

    <div class="turntable">
      <div class="disc" id="disc">
        <div class="disc-label" id="discLabel">SC</div>
      </div>
    </div>

    <div class="track-panel">
      <p class="track-kicker" id="trackKicker">NOW PLAYING</p>
      <h1 class="track-title" id="trackTitle">Night Drive</h1>
      <p class="track-artist" id="trackArtist">Sidecut Ensemble</p>

      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <span class="time end" id="durationTime">0:00</span>
      </div>

      <div class="transport">
        <button class="tbtn shuffle" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="tbtn" id="prevBtn" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM10 12l9-7v14z"/></svg>
        </button>
        <button class="tbtn play-pause" id="playBtn" aria-label="Play" title="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="nextBtn" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5l9 7-9 7z"/></svg>
        </button>
        <button class="tbtn repeat" id="repeatBtn" aria-label="Repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
        <div class="spacer-flex"></div>
        <div class="volume-row">
          <button class="tbtn" id="muteBtn" aria-label="Mute" title="Mute" style="padding:0.2rem;">
            <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M5 9v6h4l5 5V4L9 9H5z"/></svg>
          </button>
          <div class="volume-track" id="volumeTrack">
            <div class="volume-fill" id="volumeFill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="playlist" id="playlist">
    <div class="playlist-header">
      <h2>PLAYLIST</h2>
      <label class="autoplay-toggle">
        <input type="checkbox" id="autoplayToggle" checked>
        Autoplay next
      </label>
    </div>
    <div id="playlistItems"></div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  const tracks = [
    { title: 'Night Drive',   artist: 'Sidecut Ensemble', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
    { title: 'Low Tide',      artist: 'Sidecut Ensemble', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
    { title: 'Static Bloom',  artist: 'Sidecut Ensemble', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
    { title: 'Paper Cranes',  artist: 'Sidecut Ensemble', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
    { title: 'Afterglow',     artist: 'Sidecut Ensemble', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
  ];

  const audio = document.getElementById('audio');
  const disc = document.getElementById('disc');
  const discLabel = document.getElementById('discLabel');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const volumeTrack = document.getElementById('volumeTrack');
  const volumeFill = document.getElementById('volumeFill');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const autoplayToggle = document.getElementById('autoplayToggle');
  const playlistItemsEl = document.getElementById('playlistItems');

  let currentIndex = 0;
  let isPlaying = false;
  let isShuffle = false;
  let isRepeat = false;
  let volume = 0.7;
  let isMuted = false;
  let isSeeking = false;

  const iconPlay = '<path d="M8 5v14l11-7z"/>';
  const iconPause = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  const iconVolOn = '<path d="M5 9v6h4l5 5V4L9 9H5z"/>';
  const iconVolOff = '<path d="M5 9v6h4l5 5V4L9 9H5z" opacity="0.3"/><path d="M19 8l-4 4m0-4l4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';

  function formatTime(sec){
    if (!isFinite(sec) || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function renderPlaylist(){
    playlistItemsEl.innerHTML = '';
    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track-row' + (i === currentIndex ? ' active' : '');
      row.dataset.index = i;

      const leftMark = (i === currentIndex && isPlaying)
        ? `<div class="eq"><span></span><span></span><span></span></div>`
        : `<span class="track-num">${i + 1}</span>`;

      row.innerHTML = `
        ${leftMark}
        <div class="track-row-info">
          <div class="track-row-title">${t.title}</div>
          <div class="track-row-artist">${t.artist}</div>
        </div>
        <span class="track-row-duration" id="dur-${i}">--:--</span>
      `;
      row.addEventListener('click', () => loadTrack(i, true));
      playlistItemsEl.appendChild(row);

      // preload duration for each track
      const tmp = new Audio();
      tmp.preload = 'metadata';
      tmp.src = t.src;
      tmp.addEventListener('loadedmetadata', () => {
        const durEl = document.getElementById(`dur-${i}`);
        if (durEl) durEl.textContent = formatTime(tmp.duration);
      });
    });
  }

  function loadTrack(index, autoPlay){
    currentIndex = (index + tracks.length) % tracks.length;
    const t = tracks[currentIndex];
    audio.src = t.src;
    trackTitle.textContent = t.title;
    trackArtist.textContent = t.artist;
    discLabel.textContent = t.title.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    progressFill.style.width = '0%';
    progressThumb.style.left = '0%';
    currentTimeEl.textContent = '0:00';
    renderPlaylist();
    if (autoPlay){
      audio.play().catch(()=>{});
    }
  }

  function setPlaying(playing){
    isPlaying = playing;
    if (playing){
      audio.play().catch(()=>{});
      disc.classList.add('spinning');
      playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${iconPause}</svg>`;
      playBtn.setAttribute('aria-label', 'Pause');
    } else {
      audio.pause();
      disc.classList.remove('spinning');
      document.getElementById('playIcon').outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${iconPlay}</svg>`;
      playBtn.setAttribute('aria-label', 'Play');
    }
    renderPlaylist();
  }

  playBtn.addEventListener('click', () => setPlaying(!isPlaying));

  prevBtn.addEventListener('click', () => {
    if (audio.currentTime > 3){
      audio.currentTime = 0;
      return;
    }
    const next = isShuffle ? randomIndex() : currentIndex - 1;
    loadTrack(next, isPlaying);
  });

  nextBtn.addEventListener('click', () => {
    const next = isShuffle ? randomIndex() : currentIndex + 1;
    loadTrack(next, isPlaying);
  });

  function randomIndex(){
    if (tracks.length === 1) return 0;
    let r;
    do { r = Math.floor(Math.random() * tracks.length); } while (r === currentIndex);
    return r;
  }

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
  });

  repeatBtn.addEventListener('click', () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('active', isRepeat);
  });

  audio.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = (audio.currentTime / audio.duration) * 100 || 0;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    durationTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    if (isRepeat){
      audio.currentTime = 0;
      audio.play().catch(()=>{});
      return;
    }
    if (autoplayToggle.checked){
      const next = isShuffle ? randomIndex() : currentIndex + 1;
      loadTrack(next, true);
    } else {
      setPlaying(false);
    }
  });

  // Progress seeking
  function seekFromEvent(e){
    const rect = progressTrack.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
    if (isFinite(audio.duration)){
      audio.currentTime = pct * audio.duration;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }
  }

  progressTrack.addEventListener('mousedown', (e) => {
    isSeeking = true;
    seekFromEvent(e);
  });
  window.addEventListener('mousemove', (e) => { if (isSeeking) seekFromEvent(e); });
  window.addEventListener('mouseup', () => { isSeeking = false; });

  progressTrack.addEventListener('touchstart', (e) => { isSeeking = true; seekFromEvent(e); });
  progressTrack.addEventListener('touchmove', (e) => { if (isSeeking) seekFromEvent(e); });
  window.addEventListener('touchend', () => { isSeeking = false; });

  // Volume
  function setVolume(v){
    volume = Math.min(1, Math.max(0, v));
    audio.volume = isMuted ? 0 : volume;
    volumeFill.style.width = (volume * 100) + '%';
  }

  function seekVolumeFromEvent(e){
    const rect = volumeTrack.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    isMuted = false;
    setVolume(pct);
    updateVolIcon();
  }

  let isVolSeeking = false;
  volumeTrack.addEventListener('mousedown', (e) => { isVolSeeking = true; seekVolumeFromEvent(e); });
  window.addEventListener('mousemove', (e) => { if (isVolSeeking) seekVolumeFromEvent(e); });
  window.addEventListener('mouseup', () => { isVolSeeking = false; });

  function updateVolIcon(){
    const showOff = isMuted || volume === 0;
    volIcon.outerHTML = `<svg id="volIcon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">${showOff ? iconVolOff : iconVolOn}</svg>`;
  }

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    audio.volume = isMuted ? 0 : volume;
    updateVolIcon();
  });

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space'){
      e.preventDefault();
      setPlaying(!isPlaying);
    } else if (e.code === 'ArrowRight'){
      nextBtn.click();
    } else if (e.code === 'ArrowLeft'){
      prevBtn.click();
    }
  });

  // Init
  setVolume(volume);
  loadTrack(0, false);
</script>
</body>
</html>
